<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Scedura</title>
  <link rel="stylesheet" href="style.v3.css">

  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-auth-compat.js"></script>
  <!-- Vapi SDK -->
  <script type="module">
    import Vapi from "https://esm.sh/@vapi-ai/web@latest";
    window.Vapi = Vapi;
  </script>
</head>

<body>

  <!-- Login Overlay -->
  <div id="loginOverlay" class="login-overlay">
    <div class="login-box">
      <h1>Welcome to Scedura</h1>
      <p>Sign in to manage your meetings</p>
      <button id="googleLoginBtn" class="google-btn">
        <img src="https://upload.wikimedia.org/wikipedia/commons/5/53/Google_%22G%22_Logo.svg" alt="G" />
        Sign in with Google
      </button>
    </div>
  </div>

  <div class="container" id="appContainer" style="display: none;">
    <!-- Top Bar -->
    <div class="top-bar">
      <div id="userProfile" class="user-profile">
        <img id="userAvatar" src="" alt="User" />
        <span id="userName">User</span>
      </div>
      <div class="actions">
        <button id="connectCalendarBtn" class="secondary-btn">🔗 Connect Calendar</button>
        <button id="logoutBtn" class="secondary-btn">Sign Out</button>
      </div>
    </div>

    <div class="main-content">
      <!-- Left Panel: Manual Scheduling -->
      <div class="panel manual-panel">
        <h2>Schedule a Meeting</h2>
        <p>Secure a 30-minute slot manually.</p>

        <form id="meetingForm" novalidate style="flex: 1; display: flex; flex-direction: column;">
          <div class="form-group">
            <label for="name">Your Name</label>
            <input type="text" id="name" name="name" placeholder="John Doe" autocomplete="name" required />
          </div>

          <div class="form-row">
            <div class="form-group">
              <label for="date">Date</label>
              <input type="date" id="date" name="date" required />
            </div>
            <div class="form-group">
              <label for="time">Time (IST)</label>
              <input type="time" id="time" name="time" required />
            </div>
          </div>

          <div class="form-group">
            <label for="title">Title (Optional)</label>
            <input type="text" id="title" name="title" placeholder="e.g. Project Sync" maxlength="150" />
          </div>

          <div style="margin-top: auto;">
            <button type="submit" id="submitBtn" class="primary-btn">
              <span class="spinner" id="spinner"></span>
              <span id="btnLabel">Confirm Scheduling</span>
            </button>
          </div>
        </form>
      </div>

      <!-- Right Panel: AI Assistant -->
      <div class="panel ai-panel">
        <div class="ai-bg"></div>

        <div>
          <h2>Scedura Assistant</h2>
          <p>Tap below and ask to check slots or book.</p>
        </div>

        <div class="chat-container" id="chatLog">
          <!-- Default Message -->
          <div class="msg bot">Hello. I am Scedura. How can I assist with your calendar today?</div>
        </div>

        <div class="voice-controls">
          <div class="status-text" id="status">Ready to listen</div>

          <div class="mic-btn-wrapper">
            <button type="button" id="micBtn" class="mic-btn">
              <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"></path>
                <path d="M19 10v2a7 7 0 0 1-14 0v-2"></path>
                <line x1="12" y1="19" x2="12" y2="23"></line>
                <line x1="8" y1="23" x2="16" y2="23"></line>
              </svg>
            </button>
            <div class="pulse-ring"></div>
          </div>

          <p style="font-size: 0.8rem; opacity: 0.5; margin-top: 10px;">Powered by Google Gemini</p>
        </div>
      </div>
    </div>
  </div>

  <!-- Toast Notification Container -->
  <div id="toast" class="toast">
    <span id="toastIcon"></span>
    <span id="toastMsg"></span>
  </div>

  <script src="script.js"></script>
</body>

</html>
